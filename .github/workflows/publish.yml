name: "Publish"

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install system dependencies for Qt and OpenCV
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb libgl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 libxcb-shape0 \
            libglib2.0-0 libgl1-mesa-dev '^libxcb.*-dev' libx11-xcb-dev \
            libglu1-mesa-dev libxrender-dev libxi-dev libxkbcommon-dev \
            libxkbcommon-x11-dev
      - name: Start virtual display
        run: /usr/bin/Xvfb :99 -screen 0 1280x1024x24 &
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.11
      - name: Install test dependencies
        run: uv sync --locked --all-extras --dev
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Run core tests
        env:
          DISPLAY: :99
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest ./pycroglia/core/*/tests/unit ./pycroglia/core/tests/unit ./pycroglia/core/tests/integration
      - name: Run UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a uv run --no-sync pytest ./pycroglia/ui/widgets/**/tests ./pycroglia/ui/controllers/tests

  run:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Verify tag matches project version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv run --no-project python -c 'import os, tomllib; version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; expected = f"v{version}"; actual = os.environ["TAG_NAME"]; assert actual == expected, f"tag {actual!r} must match project version {expected!r}"'
      - name: Build
        run: uv build
      # Check that basic features work and we didn't miss to include crucial files
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl smoke_test.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz smoke_test.py
      - name: Publish
        run: uv publish
